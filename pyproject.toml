[project]
name = "dynworkflow"
version = "0.1.4"
description = "Dynamic Workflow Library for Alkaid0"
readme = "README.md"
authors = [{ name = "cxykevin", email = "cxykevin@yeah.net" }]
requires-python = ">=3.12"
dependencies = ["websockets>=15.0"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "mypy>=1.15"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportPrivateUsage = false
